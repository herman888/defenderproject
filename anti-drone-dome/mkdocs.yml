site_name: Project LARP
site_description: Localised Aerial Response Platform — Anti-Drone Dome documentation
site_author: Herman Isayenka
site_url: https://projectlarp.vercel.app

docs_dir: site-docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Hardware:
      - Overview: hardware/overview.md
      - Flight Controllers: hardware/flight-controllers.md
      - Radio: hardware/radio.md
  - Software:
      - Overview: software/overview.md
      - Simulation: software/simulation.md
      - Detection Pipeline: software/detection-pipeline.md
  - Firmware:
      - Flashing: firmware/flashing.md
      - Recovery: firmware/recovery.md
  - Gallery:
      - Overview: gallery/overview.md
  - Contributing: contributing.md
  - Deploy to Vercel: deploy-vercel.md
