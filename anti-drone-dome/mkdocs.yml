site_name: Project LARP
site_description: Localised Aerial Response Platform - integrated counter-UAS research and validation
site_author: Herman Isayenka
site_url: https://projectlarp.vercel.app
repo_url: https://github.com/herman888/defenderproject
repo_name: herman888/defenderproject
edit_uri: edit/main/anti-drone-dome/documentation/

docs_dir: documentation
site_dir: public
use_directory_urls: true
copyright: Research platform documentation - synthetic results are not field certification

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.action.edit
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list
  - footnotes

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
  - System:
      - Architecture: system/architecture.md
      - Implementation status: system/implementation-status.md
      - Data contracts: system/data-contracts.md
  - Simulation:
      - Quick start: software/simulation.md
      - Scenarios, environments, and maps: simulation/scenarios.md
      - Airframe fidelity and controls: simulation/fidelity-and-controls.md
      - Autonomous swarm coordination: simulation/swarm-coordination.md
      - Tactical rendering: simulation/rendering.md
  - Sensors and software:
      - Software overview: software/overview.md
      - Detection pipeline: software/detection-pipeline.md
      - Detection pipeline reference: reference/detection-pipeline-reference.md
  - ML training:
      - Training and datasets: ml-training/training.md
      - Camera and vision training: ml-training/vision-training.md
      - Controller evaluation: ml-training/evaluation.md
  - Validation:
      - Workbench overview: validation/overview.md
      - Regression campaign: validation/regression-campaign.md
      - Hardware readiness: validation/hardware-readiness.md
      - Current evidence: results/current-evidence.md
  - Operations:
      - Mission recording and replay: operations/mission-recording.md
      - External renderers and clients: integration/external-renderers.md
      - Unreal/Cesium telemetry bridge: integration/unreal-bridge.md
  - Hardware:
      - Overview: hardware/overview.md
      - Flight Controllers: hardware/flight-controllers.md
      - Radio: hardware/radio.md
      - Raspberry Pi companion: hardware/raspberry-pi-companion.md
      - Safety and integration policy: hardware/safety.md
  - Firmware:
      - Flashing: firmware/flashing.md
      - Recovery: firmware/recovery.md
      - Legacy notes: reference/firmware-legacy.md
  - Gallery:
      - Overview: gallery/overview.md
  - Development:
      - Testing and release checks: development/testing.md
      - NVIDIA GPU setup: development/gpu-setup.md
      - Contributing: contributing.md
      - Deploy to Vercel: deploy-vercel.md

# The design archive (original build prompts) is deliberately NOT published.
# It lives in docs-internal/design-archive/. Those files are AI build prompts,
# not engineering documentation, and reading as such on a public site
# undercuts the evidence the rest of the site presents.
